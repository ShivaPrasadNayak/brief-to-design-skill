<!doctype html>
<!--
  HTML deck shell — brief-to-design skill.
  Copy this file, replace the tokens in :root with the chosen design system, and write slides as
  <section class="slide" data-slide> ... </section>. Each slide is a fixed 1920x1080 canvas that is
  scaled to fit any screen, so layouts never reflow; design in px at that size.

  Controls: → ↓ Space PageDown = next · ← ↑ PageUp = back · Home/End · F = fullscreen · G = grid overview
            click right/left half or swipe on touch · #5 in the URL opens slide 5 · Cmd/Ctrl+P prints one slide per page.
  Render & QA: python ~/.claude/skills/brief-to-design/scripts/render.py deck.html
  Delete the example slides; keep the shell (style block "SHELL" + script) as is.
-->
<html lang="en" data-deck>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck title</title>
<!-- Fonts: pick from references/layout-type.md. Remove the link if using system fonts only. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS: replace per design system ===== */
:root {
  --bg: #F3F6FB;          /* light slide background */
  --surface: #FFFFFF;     /* cards, panels */
  --dark: #0A1630;        /* dark slides (title, section, close) */
  --primary: #2F6BFF;
  --secondary: #1D4ED8;
  --accent: #22C3D6;
  --text: #0A1630;
  --muted: #5B6B82;
  --on-dark: #FFFFFF;
  --on-dark-muted: #A9B8D6;
  --border: #DCE4F0;
  --font-display: "Sora", "Avenir Next", system-ui, sans-serif;
  --font-body: "DM Sans", "Helvetica Neue", system-ui, sans-serif;
  --radius: 24px;
  --margin: 120px;        /* slide side margin */
  --top: 110px;           /* title baseline zone */
}

/* ===== SHELL (keep) ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0b0d12; overflow: hidden; }
body { font-family: var(--font-body); color: var(--text); -webkit-font-smoothing: antialiased; }
.deck { position: fixed; inset: 0; display: grid; place-items: center; }
.slide {
  position: absolute; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--bg); transform-origin: center center;
  opacity: 0; visibility: hidden; transition: opacity .45s ease, transform .45s ease;
}
.slide.active { opacity: 1; visibility: visible; }
.progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--primary); transition: width .3s ease; z-index: 5; }
.grid-view .deck { position: static; display: grid; grid-template-columns: repeat(auto-fill, 384px); gap: 24px; padding: 32px; place-items: start; overflow: auto; height: 100%; }
.grid-view body, body.grid-view { overflow: auto; }
.grid-view .slide { position: relative; opacity: 1; visibility: visible; transform: scale(.2) !important; transform-origin: top left; width: 1920px; margin: 0 -1536px -864px 0; cursor: pointer; outline: 6px solid transparent; }
.grid-view .slide:hover { outline-color: var(--primary); }
@media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
@media print {
  @page { size: 1920px 1080px; margin: 0; }
  html, body { background: none; overflow: visible; height: auto; }
  .deck { position: static; display: block; }
  .slide { position: relative; opacity: 1; visibility: visible; transform: none !important; break-after: page; }
  .progress { display: none; }
}

/* ===== COMPONENTS: adapt freely; these are starting points, not a template to repeat ===== */
.dark { background: var(--dark); color: var(--on-dark); }
.eyebrow { font: 700 22px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
.dark .eyebrow { color: var(--accent); }
.h-hero { font: 800 128px/1.0 var(--font-display); letter-spacing: -0.035em; }
.h-title { font: 700 72px/1.05 var(--font-display); letter-spacing: -0.025em; max-width: 1500px; }
.lead { font: 400 34px/1.4 var(--font-body); color: var(--muted); max-width: 1100px; }
.dark .lead { color: var(--on-dark-muted); }
.body { font: 400 28px/1.45 var(--font-body); }
.stat { font: 800 140px/0.9 var(--font-display); letter-spacing: -0.04em; color: var(--primary); }
.footer { position: absolute; left: var(--margin); right: var(--margin); bottom: 56px; display: flex; justify-content: space-between; font: 500 20px/1 var(--font-body); color: var(--muted); }
.dark .footer { color: var(--on-dark-muted); }
.pad { position: absolute; inset: var(--top) var(--margin) 140px var(--margin); }
.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.credit { position: absolute; right: 24px; bottom: 16px; font: 400 14px/1 var(--font-body); color: rgba(255,255,255,.75); }
</style>
</head>
<body>
<main class="deck">

  <!-- EXAMPLE 1 — title slide (dark). Replace. -->
  <section class="slide dark" data-slide>
    <div class="pad" style="display:flex;flex-direction:column;justify-content:center;gap:40px">
      <div class="eyebrow">Eyebrow · context</div>
      <h1 class="h-hero" style="max-width:1200px">The one idea, said as a claim.</h1>
      <p class="lead">One line on what this is and who it is for.</p>
    </div>
    <div class="footer"><span>Team · Date</span><span>01</span></div>
  </section>

  <!-- EXAMPLE 2 — content slide (light). Replace. -->
  <section class="slide" data-slide>
    <div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:96px;align-content:start">
      <div style="grid-column:1/-1"><div class="eyebrow">Section</div><h2 class="h-title" style="margin-top:20px">Headline states the takeaway.</h2></div>
      <div><div class="stat">63</div><p class="body" style="margin-top:16px;color:var(--muted)">What the number means, in one line.</p></div>
      <p class="body">Supporting point. Keep each slide to one job.</p>
    </div>
    <div class="footer"><span>Deck name</span><span>02</span></div>
  </section>

</main>
<div class="progress"></div>
<script>
(() => {
  const slides = [...document.querySelectorAll('[data-slide]')];
  const bar = document.querySelector('.progress');
  let i = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1));
  const fit = () => {
    if (document.documentElement.classList.contains('grid-view')) return;
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    slides.forEach(el => el.style.transform = `scale(${s})`);
  };
  const show = n => {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((el, k) => { el.classList.toggle('active', k === i); el.setAttribute('aria-hidden', k !== i); });
    bar.style.width = `${(i + 1) / slides.length * 100}%`;
    history.replaceState(null, '', '#' + (i + 1));
  };
  const grid = on => { document.documentElement.classList.toggle('grid-view', on); if (!on) fit(); };
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (e.key === 'g' || e.key === 'G' || (e.key === 'Escape' && document.documentElement.classList.contains('grid-view'))) grid(!document.documentElement.classList.contains('grid-view'));
  });
  addEventListener('click', e => {
    const s = e.target.closest('[data-slide]');
    if (document.documentElement.classList.contains('grid-view')) { if (s) { grid(false); show(slides.indexOf(s)); } return; }
    if (e.target.closest('a,button,input,video')) return;
    show(i + (e.clientX > innerWidth / 2 ? 1 : -1));
  });
  let x0 = null;
  addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
  addEventListener('resize', fit);
  fit(); show(i);
})();
</script>
</body>
</html>
